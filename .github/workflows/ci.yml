name: CI

# Production Coolify tracks `master` and has no GitHub webhook. This workflow
# verifies the maintained branch; a separate manual Coolify action deploys
# a reviewed `master` commit.
on:
  push:
    branches: [master]
    paths-ignore:
      - "*.md"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/PULL_REQUEST_TEMPLATE.md"
  pull_request:
    branches: [master]
    paths-ignore:
      - "*.md"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/PULL_REQUEST_TEMPLATE.md"

permissions:
  contents: read

env:
  CI: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: activation_test
          POSTGRES_PASSWORD: activation-test-only
          POSTGRES_DB: keenpix_activation_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U activation_test -d keenpix_activation_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --config.minimumReleaseAge=0 --prefer-offline

      - name: Manual image workflow contracts
        run: node --test tooling/docker-images.test.mjs

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Activation migration and PostgreSQL contract
        env:
          DATABASE_URL: postgresql://activation_test:activation-test-only@127.0.0.1:5432/keenpix_activation_test
          KEENPIX_ACTIVATION_TEST_DATABASE: keenpix_activation_test
        run: |
          pnpm --filter @keenpix/database run deploy
          pnpm --filter @keenpix/database test:activation

      - name: Repository health
        run: pnpm run health
