name: Set GHCR Public

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  set-public:
    name: Set keenpix container package public
    runs-on: ubuntu-latest
    steps:
      - name: Set package visibility
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          gh api --method PATCH \
            -H "Accept: application/vnd.github.package-deletes-preview+json" \
            /user/packages/container/keenpix \
            -f visibility=public
