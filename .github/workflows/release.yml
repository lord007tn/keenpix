name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    steps:
      - name: Validate semver tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tags must be semantic versions like v0.1.0 or v0.1.0-rc.1"
            exit 1
          fi

      # Release notes resolve the previous repository tag for the full-diff link.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
          registry-url: https://registry.npmjs.org

      - name: Set up npm trusted publishing
        run: npm install --global npm@11.19.0

      - run: pnpm install --frozen-lockfile --config.minimumReleaseAge=0

      - run: pnpm db:generate

      - run: pnpm health

      - run: pnpm release:check

      - name: Verify unified release version
        run: pnpm release:verify "${GITHUB_REF_NAME}"

      - name: Validate and build structured release notes
        run: pnpm --silent release:notes "${GITHUB_REF_NAME}" > "${RUNNER_TEMP}/release-notes.md"

      - name: Publish public packages
        run: pnpm release:packages "${GITHUB_REF_NAME}"
        env:
          NPM_CONFIG_IGNORE_SCRIPTS: "true"

      - name: Publish one GitHub release
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release edit "${GITHUB_REF_NAME}" --title "Keenpix ${GITHUB_REF_NAME}" --notes-file "${RUNNER_TEMP}/release-notes.md"
          else
            gh release create "${GITHUB_REF_NAME}" --verify-tag --title "Keenpix ${GITHUB_REF_NAME}" --notes-file "${RUNNER_TEMP}/release-notes.md"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
