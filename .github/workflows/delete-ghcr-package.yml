name: Delete GHCR Package

on:
  workflow_dispatch:

permissions:
  packages: write

jobs:
  delete:
    name: Delete keenpix container package versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/delete-package-versions@v5
        with:
          owner: lord007tn
          package-name: keenpix
          package-type: container
          min-versions-to-keep: 0
