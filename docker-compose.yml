services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    # Opt-in resource caps. Default 0 = no limit, so behaviour is unchanged until
    # you set these. Values feed the cgroup the app reads on the Operations page.
    mem_limit: ${KEENPIX_PG_MEM_LIMIT:-0}
    mem_reservation: ${KEENPIX_PG_MEM_RESERVATION:-0}
    cpus: ${KEENPIX_PG_CPU_LIMIT:-0}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-keenpix}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}"
    # Keep Postgres private by default. The app connects on the internal
    # Compose network at postgres:5432.
    volumes:
      - keenpix_pg:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:v1.37.0
    restart: unless-stopped
    ulimits:
      memlock: -1
    command:
      - --dir=/data
      - --default_lua_flags=allow-undeclared-keys
      - --snapshot_cron=*/5 * * * *
    volumes:
      - keenpix_dragonfly:/data

  app:
    image: "${KEENPIX_IMAGE:-ghcr.io/lord007tn/keenpix:latest}"
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
    # Opt-in resource caps. Default 0 = no limit. Setting KEENPIX_MEM_LIMIT makes
    # the Operations page CPU/RAM gauges read against a real cgroup cap and lets
    # Docker enforce it. Note: too low a memory cap can get the app OOM-killed.
    mem_limit: ${KEENPIX_MEM_LIMIT:-0}
    mem_reservation: ${KEENPIX_MEM_RESERVATION:-0}
    cpus: ${KEENPIX_CPU_LIMIT:-0}
    depends_on:
      postgres:
        condition: service_healthy
      dragonfly:
        condition: service_started
    environment:
      NODE_ENV: production
      PORT: "3000"
      # Self-host is the default (KEENPIX_MODE unset); no separate self-host flag.
      DATABASE_URL: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-keenpix}"
      # Required for session signing. Compose refuses to start if this is unset,
      # so copied deployments cannot accidentally ship with a default secret.
      BETTER_AUTH_SECRET: "${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET (openssl rand -hex 32)}"
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      KEENPIX_SUPER_ADMIN_EMAIL: "${KEENPIX_SUPER_ADMIN_EMAIL:?set KEENPIX_SUPER_ADMIN_EMAIL}"
      KEENPIX_SUPER_ADMIN_PASSWORD: "${KEENPIX_SUPER_ADMIN_PASSWORD:?set KEENPIX_SUPER_ADMIN_PASSWORD}"
      KEENPIX_CACHE_DIR: /var/cache/keenpix
      KEENPIX_CACHE_MAX_BYTES: "${KEENPIX_CACHE_MAX_BYTES:-8589934592}"
      KEENPIX_CACHE_STALE_MS: "${KEENPIX_CACHE_STALE_MS:-86400000}"
      KEENPIX_MEMORY_CACHE_MAX_BYTES: "${KEENPIX_MEMORY_CACHE_MAX_BYTES:-268435456}"
      KEENPIX_QUEUE_URL: redis://dragonfly:6379
      KEENPIX_WORKER_CONCURRENCY: "${KEENPIX_WORKER_CONCURRENCY:-4}"
      KEENPIX_WORKER_SECRET: "${KEENPIX_WORKER_SECRET:?set KEENPIX_WORKER_SECRET (openssl rand -hex 32)}"
    ports:
      - "${KEENPIX_PORT:-3000}:3000"
    volumes:
      - keenpix_cache:/var/cache/keenpix
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--output", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s

  worker:
    image: "${KEENPIX_IMAGE:-ghcr.io/lord007tn/keenpix:latest}"
    command: ["worker"]
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on:
      app:
        condition: service_healthy
      dragonfly:
        condition: service_started
    environment:
      NODE_ENV: production
      KEENPIX_APP_URL: http://app:3000
      KEENPIX_QUEUE_URL: redis://dragonfly:6379
      KEENPIX_WORKER_CONCURRENCY: "${KEENPIX_WORKER_CONCURRENCY:-4}"
      KEENPIX_WORKER_SECRET: "${KEENPIX_WORKER_SECRET:?set KEENPIX_WORKER_SECRET (openssl rand -hex 32)}"
      LOG_LEVEL: ${LOG_LEVEL:-info}

volumes:
  keenpix_pg:
  keenpix_dragonfly:
  keenpix_cache:
