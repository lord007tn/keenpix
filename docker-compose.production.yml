# Production deployment for keenpix.com on Coolify.
#
# This stack builds Keenpix from the reviewed `master` commit selected in
# Coolify. Pushing `master` does not deploy it automatically.
services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    mem_limit: ${KEENPIX_PG_MEM_LIMIT:-0}
    cpus: ${KEENPIX_PG_CPU_LIMIT:-0}
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-keenpix_branch}
      - POSTGRES_USER=${SERVICE_USER_POSTGRES}
      - POSTGRES_PASSWORD=${SERVICE_PASSWORD_64_POSTGRES}
    volumes:
      - keenpix_branch_pg18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$SERVICE_USER_POSTGRES\" -d \"${POSTGRES_DB:-keenpix_branch}\""]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    environment:
      - CLICKHOUSE_DB=${CLICKHOUSE_DATABASE:-keenpix_branch}
      - CLICKHOUSE_USER=${CLICKHOUSE_USER:-default}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD}
    volumes:
      - keenpix_branch_clickhouse:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:v1.37.0
    restart: unless-stopped
    ulimits:
      memlock: -1
    command:
      - --dir=/data
      - --default_lua_flags=allow-undeclared-keys
      - --snapshot_cron=*/5 * * * *
    volumes:
      - keenpix_branch_dragonfly:/data

  maxio:
    image: ghcr.io/coollabsio/maxio@sha256:2e7fc2a32d66fb31c44ce366e8a289218d3c38fcbe25bd6fa575b4df7c0e0272
    command: serve
    restart: unless-stopped
    environment:
      - MAXIO_ACCESS_KEY=${KEENPIX_CACHE_S3_ACCESS_KEY_ID:-${SERVICE_USER_MAXIO}}
      - MAXIO_SECRET_KEY=${KEENPIX_CACHE_S3_SECRET_ACCESS_KEY:-${SERVICE_PASSWORD_64_MAXIO}}
      - MAXIO_REGION=auto
      - MAXIO_DEFAULT_BUCKETS=${KEENPIX_CACHE_S3_BUCKET:-keenpix-branch-cache}
    volumes:
      - keenpix_branch_maxio:/data

  mailpit:
    image: axllent/mailpit:v1.22
    restart: unless-stopped
    environment:
      - SERVICE_URL_MAILPIT_8025
    expose:
      - "1025"
      - "8025"

  app:
    build:
      context: .
      dockerfile: apps/app/Dockerfile
      args:
        VITE_KEENPIX_PUBLIC_URL: ${KEENPIX_APP_URL:?set KEENPIX_APP_URL}
        VITE_GTM_CONTAINER_ID: ${VITE_GTM_CONTAINER_ID:?set the verified managed GTM container}
        VERSION: ${SOURCE_COMMIT:-master}
    restart: unless-stopped
    mem_limit: ${KEENPIX_MEM_LIMIT:-0}
    cpus: ${KEENPIX_CPU_LIMIT:-0}
    # Give the HTTP server room to drain active requests before Docker SIGKILLs.
    stop_grace_period: ${KEENPIX_SHUTDOWN_GRACE:-30s}
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      dragonfly:
        condition: service_started
      maxio:
        condition: service_started
      mailpit:
        condition: service_started
      transform:
        condition: service_healthy
    environment:
      SERVICE_URL_APP_3000: ${KEENPIX_APP_URL:?set KEENPIX_APP_URL}
      SERVICE_URL_APP: ${KEENPIX_APP_URL:?set KEENPIX_APP_URL}
      NODE_ENV: production
      PORT: "3000"
      KEENPIX_MODE: cloud
      KEENPIX_DEPLOYMENT_ENV: production
      DATABASE_URL: postgresql://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_64_POSTGRES}@${KEENPIX_POSTGRES_HOST:-postgres}:5432/${POSTGRES_DB:-keenpix_branch}
      BETTER_AUTH_SECRET: ${SERVICE_HEX_64_KEENPIX}
      BETTER_AUTH_URL: ${KEENPIX_APP_URL:?set KEENPIX_APP_URL}
      KEENPIX_APP_URL: ${KEENPIX_APP_URL:?set KEENPIX_APP_URL}
      KEENPIX_TRANSFORM_URL: http://transform:3002
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      VITE_KEENPIX_PUBLIC_URL: ${KEENPIX_APP_URL:?set KEENPIX_APP_URL}
      VITE_GTM_CONTAINER_ID: ${VITE_GTM_CONTAINER_ID:?set the verified managed GTM container}
      KEENPIX_SUPER_ADMIN_EMAIL: ${KEENPIX_SUPER_ADMIN_EMAIL}
      KEENPIX_SUPER_ADMIN_PASSWORD: ${KEENPIX_SUPER_ADMIN_PASSWORD}
      KEENPIX_RUN_MIGRATIONS: ${KEENPIX_RUN_MIGRATIONS:-true}
      KEENPIX_RUN_SEED: ${KEENPIX_RUN_SEED:-false}
      CLICKHOUSE_URL: http://${KEENPIX_CLICKHOUSE_HOST:-clickhouse}:8123
      CLICKHOUSE_DATABASE: ${CLICKHOUSE_DATABASE:-keenpix_branch}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      KEENPIX_CACHE_S3_BUCKET: ${KEENPIX_CACHE_S3_BUCKET:-keenpix-branch-cache}
      KEENPIX_CACHE_S3_ENDPOINT: ${KEENPIX_CACHE_S3_ENDPOINT:-http://maxio:9000}
      KEENPIX_CACHE_S3_REGION: ${KEENPIX_CACHE_S3_REGION:-auto}
      KEENPIX_CACHE_S3_ACCESS_KEY_ID: ${KEENPIX_CACHE_S3_ACCESS_KEY_ID:-${SERVICE_USER_MAXIO}}
      KEENPIX_CACHE_S3_SECRET_ACCESS_KEY: ${KEENPIX_CACHE_S3_SECRET_ACCESS_KEY:-${SERVICE_PASSWORD_64_MAXIO}}
      KEENPIX_CACHE_DIR: /var/cache/keenpix
      KEENPIX_QUEUE_URL: redis://dragonfly:6379
      KEENPIX_WORKER_CONCURRENCY: ${KEENPIX_WORKER_CONCURRENCY:-4}
      KEENPIX_WORKER_SECRET: ${SERVICE_HEX_64_KEENPIX_WORKER}
      # Seconds srvx waits for in-flight HTTP requests to finish on SIGTERM before
      # force-closing. Keep ≤ stop_grace_period so slow transforms can complete.
      SERVER_SHUTDOWN_TIMEOUT: "${SERVER_SHUTDOWN_TIMEOUT:-25}"
      POLAR_TOKEN: ${POLAR_TOKEN}
      POLAR_SERVER: ${POLAR_SERVER:?set POLAR_SERVER to sandbox or production}
      POLAR_WEBHOOK_SECRET: ${POLAR_WEBHOOK_SECRET}
      POLAR_SANDBOX_WEBHOOK_SECRET: ${POLAR_SANDBOX_WEBHOOK_SECRET:-}
      POLAR_SUCCESS_URL: ${POLAR_SUCCESS_URL:-/app/dashboard}
      # Default is the bundled Mailpit sink (staging). PRODUCTION MUST OVERRIDE:
      # set EMAIL_PROVIDER=postmark (or resend) + its credentials in Coolify so
      # verification, invite, usage, and dunning emails reach real inboxes.
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-smtp}
      POSTMARK_API_KEY: ${POSTMARK_API_KEY}
      POSTMARK_FROM: ${POSTMARK_FROM}
      POSTMARK_MESSAGE_STREAM: ${POSTMARK_MESSAGE_STREAM:-outbound}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:?set Cloudflare zone Analytics Read token}
      CLOUDFLARE_ACCOUNT_API_TOKEN: ${CLOUDFLARE_ACCOUNT_API_TOKEN:?set Cloudflare Account Analytics Read token}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:?set Cloudflare account ID}
      CLOUDFLARE_ZONE_ID: ${CLOUDFLARE_ZONE_ID:?set Cloudflare zone ID}
      CLOUDFLARE_HOST: ${CLOUDFLARE_HOST:-}
      CLOUDFLARE_SAAS_API_TOKEN: ${CLOUDFLARE_SAAS_API_TOKEN:-}
      CLOUDFLARE_SAAS_ZONE_ID: ${CLOUDFLARE_SAAS_ZONE_ID:-}
      CLOUDFLARE_SAAS_CNAME_TARGET: ${CLOUDFLARE_SAAS_CNAME_TARGET:-}
      CLOUDFLARE_SAAS_EDGE_SECRET: ${CLOUDFLARE_SAAS_EDGE_SECRET:-}
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_FROM: ${RESEND_FROM}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-no-reply@keenpix.test}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Keenpix}
      CRON_SECRET: ${CRON_SECRET}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--output", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s

  transform:
    image: ghcr.io/lord007tn/keenpix-transform:${KEENPIX_RUNTIME_IMAGE_TAG:-v0.3.2}
    pull_policy: always
    restart: unless-stopped
    stop_grace_period: ${KEENPIX_SHUTDOWN_GRACE:-30s}
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      dragonfly:
        condition: service_started
      maxio:
        condition: service_started
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_64_POSTGRES}@${KEENPIX_POSTGRES_HOST:-postgres}:5432/${POSTGRES_DB:-keenpix_branch}
      KEENPIX_MODE: cloud
      CLICKHOUSE_URL: http://${KEENPIX_CLICKHOUSE_HOST:-clickhouse}:8123
      CLICKHOUSE_DATABASE: ${CLICKHOUSE_DATABASE:-keenpix_branch}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      KEENPIX_CACHE_S3_BUCKET: ${KEENPIX_CACHE_S3_BUCKET:-keenpix-branch-cache}
      KEENPIX_CACHE_S3_ENDPOINT: ${KEENPIX_CACHE_S3_ENDPOINT:-http://maxio:9000}
      KEENPIX_CACHE_S3_REGION: ${KEENPIX_CACHE_S3_REGION:-auto}
      KEENPIX_CACHE_S3_ACCESS_KEY_ID: ${KEENPIX_CACHE_S3_ACCESS_KEY_ID:-${SERVICE_USER_MAXIO}}
      KEENPIX_CACHE_S3_SECRET_ACCESS_KEY: ${KEENPIX_CACHE_S3_SECRET_ACCESS_KEY:-${SERVICE_PASSWORD_64_MAXIO}}
      KEENPIX_CACHE_DIR: /var/cache/keenpix
      KEENPIX_CACHE_REDIS_URL: redis://dragonfly:6379
      KEENPIX_CACHE_DRAGONFLY_MAX_BYTES: ${KEENPIX_CACHE_DRAGONFLY_MAX_BYTES:-536870912}
      KEENPIX_CACHE_DELETE_AFTER_MS: ${KEENPIX_CACHE_DELETE_AFTER_MS:-2592000000}
      KEENPIX_MAX_WATERMARK_BYTES: ${KEENPIX_MAX_WATERMARK_BYTES:-5242880}
      KEENPIX_TRANSFORM_PORT: 3002
      KEENPIX_WORKER_SECRET: ${SERVICE_HEX_64_KEENPIX_WORKER}
      CLOUDFLARE_SAAS_EDGE_SECRET: ${CLOUDFLARE_SAAS_EDGE_SECRET:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - keenpix_branch_cache:/var/cache/keenpix
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--output", "/dev/null", "http://127.0.0.1:3002/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  worker:
    image: ghcr.io/lord007tn/keenpix-worker:${KEENPIX_RUNTIME_IMAGE_TAG:-v0.3.2}
    pull_policy: always
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      transform:
        condition: service_healthy
      dragonfly:
        condition: service_started
    environment:
      NODE_ENV: production
      KEENPIX_TRANSFORM_URL: http://transform:3002
      KEENPIX_QUEUE_URL: redis://dragonfly:6379
      KEENPIX_WORKBENCH_PASSWORD: ${KEENPIX_WORKBENCH_PASSWORD:-${SERVICE_PASSWORD_64_WORKBENCH}}
      KEENPIX_WORKBENCH_USERNAME: ${KEENPIX_WORKBENCH_USERNAME:-${SERVICE_USER_WORKBENCH}}
      KEENPIX_WORKER_CONCURRENCY: ${KEENPIX_WORKER_CONCURRENCY:-4}
      KEENPIX_WORKER_PORT: 3001
      KEENPIX_WORKER_SECRET: ${SERVICE_HEX_64_KEENPIX_WORKER}
      LOG_LEVEL: ${LOG_LEVEL:-info}

  docs:
    image: ghcr.io/lord007tn/keenpix-docs:${KEENPIX_RUNTIME_IMAGE_TAG:-v0.3.2}
    pull_policy: always
    restart: unless-stopped
    environment:
      SERVICE_URL_DOCS_3003: ${KEENPIX_DOCS_URL:-http://localhost:3003}
      SERVICE_URL_DOCS: ${KEENPIX_DOCS_URL:-http://localhost:3003}
      NODE_ENV: production
      PORT: "3003"
    expose:
      - "3003"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3003/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  usage-cron:
    image: curlimages/curl@sha256:7c12af72ceb38b7432ab85e1a265cff6ae58e06f95539d539b654f2cfa64bb13
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        while true; do
          until curl -fsS http://app:3000/api/health > /dev/null; do
            sleep 10;
          done;
          echo "usage report started: $$(date -u +%Y-%m-%dT%H:%M:%SZ)";
          if curl -fsS --retry 3 --retry-all-errors --retry-delay 5 -X POST -H "Authorization: Bearer ${CRON_SECRET}" http://app:3000/api/internal/billing/report-usage; then
            date +%s > /tmp/keenpix-usage-last-success;
            printf '\n';
          else
            echo "Keenpix usage report failed" >&2;
          fi;
          sleep 3600;
        done
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/keenpix-usage-last-success && now=$$(date +%s) && last=$$(cat /tmp/keenpix-usage-last-success) && test $$((now-last)) -lt 7500"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 180s

  # Daily compressed pg_dump into its own volume, pruned after
  # KEENPIX_BACKUP_KEEP_DAYS. Postgres is the money-critical source of truth
  # (users, subscriptions, billing watermarks) — this protects against container
  # or data-volume loss. Pair it with host/volume-level offsite backups (or an
  # R2 sync) for disk-loss coverage; restore steps in DEPLOY-PRODUCTION.md.
  pg-backup:
    image: postgres:18-alpine
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - PGHOST=postgres
      - PGUSER=${SERVICE_USER_POSTGRES}
      - PGPASSWORD=${SERVICE_PASSWORD_64_POSTGRES}
      - PGDATABASE=${POSTGRES_DB:-keenpix_branch}
      - KEEP_DAYS=${KEENPIX_BACKUP_KEEP_DAYS:-14}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        while true; do
          ts=$$(date -u +%Y%m%d-%H%M%S);
          if pg_dump -Fc -f "/backups/keenpix-$$ts.dump.tmp"; then
            mv "/backups/keenpix-$$ts.dump.tmp" "/backups/keenpix-$$ts.dump";
            echo "backup written: keenpix-$$ts.dump";
          else
            rm -f "/backups/keenpix-$$ts.dump.tmp";
            echo "BACKUP FAILED at $$ts" >&2;
          fi;
          find /backups -name 'keenpix-*.dump' -mtime +$$KEEP_DAYS -delete;
          sleep 86400;
        done
    volumes:
      - keenpix_branch_pg_backups:/backups

volumes:
  # Preserve these legacy names: changing them would attach fresh empty volumes
  # on the next production deployment.
  keenpix_branch_pg18:
  keenpix_branch_clickhouse:
  keenpix_branch_dragonfly:
  keenpix_branch_maxio:
  keenpix_branch_cache:
  keenpix_branch_pg_backups:
